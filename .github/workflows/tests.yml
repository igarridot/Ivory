name: Tests

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests and container (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check syntax and run tests
        run: make test
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Test the Alpine image
        run: docker build --target test --tag ivory-piano:test .
      - name: Build runtime image
        run: docker build --target runtime --tag ivory-piano:test-runtime .
      - name: Check container and persistent uploads
        env:
          TEST_IMAGE: ivory-piano:test-runtime
        run: node scripts/container-smoke.mjs
