<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173d32">
  <meta name="description" content="Tu espacio para aprender piano desde cero. Práctica visual, teoría y pequeños avances cada día.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Ivory · Tu primer piano</title>
  <script>
    try {
      const mode = localStorage.getItem('ivory.theme') || 'system';
      document.documentElement.dataset.theme = mode === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : mode;
    } catch { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
  </script>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog"></dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
